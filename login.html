<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log in | Inner Circle</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body class="account-page"><main class="account-layout"><section class="account-intro"><a class="brand" href="index.html" aria-label="Inner Circle home"><img class="brand-logo" src="inner-circle-logo-light.png" alt="Inner Circle"></a><div><span class="eyebrow">MEMBER ACCESS</span><h1>Welcome back to your savings circle.</h1><p>Log in to review your contributions and savings progress.</p></div><p class="intro-foot">New here? <a href="register.html">Create your account</a></p></section><section class="form-panel compact"><div class="form-heading"><h2>Log in</h2><p>Enter the email and password used when you joined.</p></div><div id="form-message" class="message" role="alert" aria-live="polite"></div><form id="login-form" novalidate><label>Email address<input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input name="password" type="password" autocomplete="current-password" required placeholder="Your password"></label><button class="button full-width" type="submit">Log in</button></form><p class="form-footer">Don't have an account? <a href="register.html">Join Inner Circle</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script></body></html>
