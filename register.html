<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join Inner Circle</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css">
</head>
<body class="account-page">
  <main class="account-layout">
    <section class="account-intro"><a class="brand" href="index.html" aria-label="Inner Circle home"><img class="brand-logo" src="assets/inner-circle-logo-light.png" alt="Inner Circle"></a><div><span class="eyebrow">BECOME A MEMBER</span><h1>Start building your savings future today.</h1><p>Join a community committed to transparency, accountability, and progress.</p></div><p class="intro-foot">Already a member? <a href="login.html">Log in to your account</a></p></section>
    <section class="form-panel"><div class="form-heading"><h2>Create your account</h2><p>All fields are required unless marked optional.</p></div><div id="form-message" class="message" role="alert" aria-live="polite"></div>
      <form id="register-form" novalidate>
        <label>Full name<input name="name" autocomplete="name" required placeholder="Your full name"></label>
        <label>Phone number<input name="phone" type="tel" autocomplete="tel" required placeholder="e.g. +256 700 000 000"></label>
        <label>Email address<input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label>
        <div class="two-columns"><label>Password<input name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters"></label><label>Confirm password<input name="confirmPassword" type="password" autocomplete="new-password" required placeholder="Repeat password"></label></div>
        <label class="check-label"><input name="rules" type="checkbox" required><span>I agree to the Inner Circle membership rules and responsible use of my information.</span></label>
        <button class="button full-width" type="submit">Create account</button>
      </form><p class="form-footer">Already registered? <a href="login.html">Log in</a></p>
    </section>
  </main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script>
</body></html>
